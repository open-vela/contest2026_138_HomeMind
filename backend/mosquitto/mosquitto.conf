# HomeMind C1 MQTT Broker（eclipse-mosquitto:2）
# 内部 1883 仅 docker 网络（明文，allow_anonymous）
# 外部 8883 强制 TLS + 用户名/密码（设备与家庭网关走这条）
per_listener_settings true

# ---- 内部（api 容器访问）----
listener 1883
allow_anonymous true

# ---- 外部（设备/网关主动出站）----
listener 8883
allow_anonymous false
password_file /mosquitto/config/password.txt
cafile     /mosquitto/certs/fullchain.pem
certfile   /mosquitto/certs/fullchain.pem
keyfile    /mosquitto/certs/privkey.pem

# 主题 ACL 前缀约定：device/<id>/cmd | device/<id>/ack | device/<id>/status
