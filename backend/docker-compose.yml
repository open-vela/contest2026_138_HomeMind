# HomeMind C1 最小云端部署（单机 Docker Compose，验证版）
# 外部端口：仅 443(HTTPS/WSS) + 80(跳转) + 8883(MQTT TLS)
# 内部：api<->mqtt 走 docker 网络 1883 明文
version: '3.8'

services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    environment:
      - WX_APPID=${WX_APPID:?WX_APPID must be set}
      - WX_APPSECRET=${WX_APPSECRET:?WX_APPSECRET must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ACCESS_TOKEN_TTL_MIN=${ACCESS_TOKEN_TTL_MIN:-120}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-30}
      - COMMAND_TTL_SEC=${COMMAND_TTL_SEC:-30}
      - SQLITE_PATH=/app/data/homemind.db
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - DEMO_DEVICE_ID=${DEMO_DEVICE_ID:-esp32s3-eye}
      - ALLOWED_ACTIONS=${ALLOWED_ACTIONS:-led.on,led.off,device.info}
      - MEDIA_TOKEN=${MEDIA_TOKEN:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2.5}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./api/data:/app/data
    depends_on:
      - mqtt
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/password.txt:/mosquitto/config/password.txt:ro
      - ./certs:/mosquitto/certs:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
